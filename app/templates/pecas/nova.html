<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Peça — TUI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .form-select {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text);
            background: var(--card);
            transition: border-color .15s;
        }
        .form-select:focus { outline: none; border-color: var(--primary); }
    </style>
</head>
<body>

<header class="page-header">
    <div class="page-header-title">
        Nova Peça
        <span class="badge">TUI</span>
    </div>
    <div class="page-nav-links">
        <a href="{{ url_for('pecas') }}">← Peças</a>
        <a href="{{ url_for('landing_page') }}" class="btn-back">← Início</a>
    </div>
</header>

<div class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}{% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('nova_peca') }}">
        <h2>Cadastrar Nova Peça</h2>

        <div style="padding: 0 20px 20px;">

            <div class="form-group">
                <label for="codigo">Código *</label>
                <input type="text" name="codigo" id="codigo" required
                       placeholder="Ex: ROLAM-NEW"
                       style="width:100%; padding:9px 12px; border:1.5px solid var(--border);
                              border-radius:var(--radius-sm); font-size:0.95rem; font-family:inherit;
                              color:var(--text); text-transform:uppercase;">
            </div>

            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" name="nome" id="nome" required
                       placeholder="Ex: Rolamento dianteiro"
                       style="width:100%; padding:9px 12px; border:1.5px solid var(--border);
                              border-radius:var(--radius-sm); font-size:0.95rem; font-family:inherit;
                              color:var(--text);">
            </div>

            <div class="form-group">
                <label for="origem">Origem *</label>
                <select name="origem" id="origem" required class="form-select">
                    <option value="IMPORTADA">Importada</option>
                    <option value="FERRAMENTARIA">Ferramentaria</option>
                </select>
            </div>

            <div class="form-group">
                <label for="container_tipo">Tipo de Container</label>
                <select name="container_tipo" id="container_tipo" class="form-select">
                    <option value="PADRAO">Padrão</option>
                    <option value="BATERIA">Bateria</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="tem_variacao_cor" id="tem_variacao_cor"
                           style="margin-right:6px;">
                    Possui variação de cor (ex: paralamas)
                </label>
            </div>

            <div class="form-group">
                <label for="peca_pai_id">Componente de (opcional)</label>
                <select name="peca_pai_id" id="peca_pai_id" class="form-select">
                    <option value="">— peça raiz —</option>
                    {% for p in pecas_raiz %}
                    <option value="{{ p.id }}">{{ p.codigo }} — {{ p.nome }}</option>
                    {% endfor %}
                </select>
                <small style="color:var(--text-muted); font-size:0.8rem;">
                    Preencha somente se for um componente de um kit existente.
                </small>
            </div>

            <button type="submit" class="btn-submit" style="width:100%; margin:8px 0 0;">
                Cadastrar Peça
            </button>

        </div>
    </form>
</div>

</body>
</html>
